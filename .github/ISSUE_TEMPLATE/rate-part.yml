name: 部件评价
description: 30 秒写完。三项必填（总分 / 是否用过 / 一句话理由），四维打分是可选项。
title: "[评分] "
labels: ["rating"]
body:
  - type: markdown
    attributes:
      value: |
        **只有三项必填**，其余都可以跳过。

        从部件页点「写评价」进来时，标题里已经带了部件 id —— **不用再手填**。
        想改分直接编辑这条 issue，不要开新的（一人一件一票，重复开只会覆盖旧的那条）。

  - type: dropdown
    id: score
    attributes:
      label: 总分
      description: 整体值不值。5 = 会再买 / 会推荐；3 = 能用但有明显问题；1 = 不会再用
      options: ["5", "4", "3", "2", "1"]
    validations:
      required: true

  - type: checkboxes
    id: own_hardware
    attributes:
      label: 你用过这个件吗？
      description: 这一项决定这条评价的可信度 —— 装过机的人打的分会单独统计。
      options:
        - label: 我装过 / 用过
          required: false
    validations:
      required: false

  - type: textarea
    id: note
    attributes:
      label: 一句话理由
      description: 一句话就够，100 字内。带上数字（负载、占空比、温度、用了多久）比形容词有用得多。
      placeholder: 髋关节，整机 20 kg，连续 30 N·m 跑了三个月，外壳 55 ℃；背隙比标称大。
      maxlength: 120
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ### 可选：分维度打分

        **不填也能提交。** 填了会让这条评价更有用 —— 同样打 4 分，
        「参数靠谱但文档稀烂」和「文档齐全但做工一般」对下一个人完全是两回事。
        不同品类关心的维度不一样，页面上只显示这一类该看的维度。

  - type: dropdown
    id: value
    attributes:
      label: 性价比
      description: 同等能力下，这个价格值不值
      options: ["5 - 很值", "4 - 合理", "3 - 一般", "2 - 偏贵", "1 - 不值"]
    validations:
      required: false

  - type: dropdown
    id: build
    attributes:
      label: 做工
      description: 外壳、端子、背隙、装配一致性
      options: ["5 - 扎实", "4 - 良好", "3 - 一般", "2 - 有瑕疵", "1 - 明显缺陷"]
    validations:
      required: false

  - type: dropdown
    id: docs
    attributes:
      label: 文档与支持
      description: 手册、SDK、固件、厂家回复速度
      options: ["5 - 齐全好用", "4 - 够用", "3 - 勉强", "2 - 缺关键信息", "1 - 基本没有"]
    validations:
      required: false

  - type: dropdown
    id: spec_trust
    attributes:
      label: 参数可信度
      description: 标称的数字和你实际用下来的感受是否对得上（芯片 / 电机 / 传感器这类看这项）
      options: ["5 - 完全对得上", "4 - 基本对得上", "3 - 有小偏差", "2 - 偏差明显", "1 - 与宣称不符"]
    validations:
      required: false

  - type: dropdown
    id: compat
    attributes:
      label: 兼容与生态
      description: 驱动、固件、社区资料好不好接（主控板这类看这项）
      options: ["5 - 开箱即用", "4 - 有坑但能通", "3 - 要自己写不少", "2 - 生态很差", "1 - 基本没法用"]
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### 可选：使用工况

        工况决定这条评价对别人有没有参考价值 —— 但同样可以不填。

  - type: dropdown
    id: duration
    attributes:
      label: 用了多久
      options: ["<1个月", "1-3个月", "3-12个月", ">1年"]
    validations:
      required: false

  - type: dropdown
    id: load
    attributes:
      label: 负载情况
      options: ["轻载测试", "常规", "满载连续"]
    validations:
      required: false

  - type: dropdown
    id: batch
    attributes:
      label: 使用批量
      options: ["单件样机", "小批量", "量产"]
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 用在什么上（可选）
      placeholder: 四足 / 机械臂 / 云台 / 轮式底盘
    validations:
      required: false

  - type: input
    id: part
    attributes:
      label: 部件 id（可选，通常留空）
      description: 从部件页点「写评价」进来时，标题里已经带了 id，这里留空即可。手动填只有一种情况：你在别处复制了 id 想指定。
      placeholder: 达妙-dm-dm-j10422p-2ec
    validations:
      required: false
