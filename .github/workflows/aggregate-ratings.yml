name: Aggregate ratings from issues

# 评分数据源：GitHub issue（Issue Forms 表单）。
# 为什么不用 Discussions 投票：投票只能手点创建，46 个部件没法维护。
# 这条工作流做三件事：拉 issue → 聚合成 ratings_snapshot.json → 有变化就提交。
# 提交后会触发一次 Pages 部署（pages.yml 的 paths 含 data/**），于是站点分数就更新了。
#
# 数据归属（裁定）：
#   · 社区快照（data/ratings_snapshot.json、data/reviews_snapshot.json）归**本仓** ——
#     它们由本仓 issue 聚合而来，要跟着本仓一起提交、一起部署。
#   · `RoboWiki` 仓的锁定 release 只装目录数据（catalog / taxonomy / schema / assets）。
#     聚合前必须先把 release 解压到 .data/ 借它的 catalog 校验部件 id，
#     但产物绝不写回 .data/：那里是只读的发布物，写进去既不会提交也会被下次解压覆盖。

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  # 推送后要显式派发 pages.yml：用 GITHUB_TOKEN 推的提交不会触发其他 workflow
  # （GitHub 的防递归规则），光靠 pages.yml 的 push paths 等不到部署。
  actions: write

concurrency:
  group: ratings
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 评分要按目录校验部件 id，而目录只在`RoboWiki` 仓的锁定 release 里（本仓没有 data/catalog）。
      # 复用 scripts/fetch-data-release.sh：它负责 SHA-256 / MANIFEST 校验，并把
      # ROBOWIKI_DATA_DIR / SCHEMA_DIR / ASSETS_DIR 写进 GITHUB_ENV 供后续步骤使用。
      - name: fetch pinned data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-data-release.sh

      - name: export issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label rating --state all --limit 1000 \
            --json number,title,author,body,labels,state,createdAt \
            > /tmp/issues.json
          gh issue list --label review --state all --limit 1000 \
            --json number,title,author,body,labels,state,createdAt \
            > /tmp/reviews.json
          python -c "import json;print('rating',len(json.load(open('/tmp/issues.json'))),'review',len(json.load(open('/tmp/reviews.json'))))"

      - name: aggregate
        # --out data：目录从 ROBOWIKI_DATA_DIR（.data/data）读，快照写到本仓 data/。
        # 不拆开的话默认会把快照写进 .data/data/，那是解压出来的临时目录 ——
        # 既不进 git，页面构建也读不到本仓的 data/。
        run: |
          python -m pipeline.ingest_ratings /tmp/issues.json --out data
          python -m pipeline.ingest_reviews /tmp/reviews.json --out data

      - name: commit if changed
        id: commit
        run: |
          set -euo pipefail
          SNAPSHOTS="data/ratings_snapshot.json data/ratings_errors.json data/reviews_snapshot.json data/reviews_errors.json"

          # 记下这一步到底有没有提交：没有变化就不该再派发一次部署。
          # 本地复跑脚本时 GITHUB_OUTPUT 为空，要能跳过而不是写失败。
          changed() {
            echo "changed=$1"
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "changed=$1" >> "$GITHUB_OUTPUT"
            fi
          }

          # 用 git status 而不是 git diff：首次产出时这些文件还是 untracked，
          # git diff 看不见它们，会把「有新快照」误判成「没有变化」直接退出。
          if [ -z "$(git status --porcelain -- $SNAPSHOTS)" ]; then
            echo "没有变化"
            changed false
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 逐个 add：某个 ingest 没产出 / 没变化时单个文件缺失不能让整次提交失败。
          for f in $SNAPSHOTS; do
            if [ -f "$f" ]; then
              git add -- "$f"
            else
              echo "跳过不存在的 $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "暂存区没有实际变化"
            changed false
            exit 0
          fi

          git commit -m "chore(community): 从 issue 重新聚合评分与实测"
          git push
          changed true

      # GITHUB_TOKEN 推的提交不会触发 pages.yml（防递归），所以在这里显式派发。
      # pages.yml 保留 data/** 的 push paths，是为了人工 / PAT 推送时也能部署。
      - name: dispatch pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
