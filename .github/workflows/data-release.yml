name: Data release

# 数据独立版本化（P0-③）：把 data/ 打成一个可被外部 pin 的发布物。
# 目的：将来若真要拆成独立数据仓，下游已经可以按版本引用「某月的数据集」，
# 而不是被迫跟站点的发布节奏走。
#
# 触发：手动作业，或打 tag（data-v*）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（默认按日期生成）"
        required: false
  push:
    tags:
      - "data-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: 校验数据（不通过就不发）
        run: |
          python3 -m pip install --quiet -e .
          python3 -m pipeline validate

      - name: 打包 data/
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="data-$(date -u +%Y.%m.%d)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # 只打数据（含 schema 与 id 注册表），不打代码与站点产物
          mkdir -p dist
          tar -czf "dist/robowiki-data-${TAG}.tar.gz" data schema
          ( cd dist && sha256sum "robowiki-data-${TAG}.tar.gz" > "SHA256SUMS.txt" )
          ls -lh dist

      - name: 生成清单
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          root = pathlib.Path('.')
          parts = sum(len(json.loads(f.read_text(encoding='utf-8')))
                      for f in (root/'data/catalog').glob('*/*.json'))
          robots = sum(len(json.loads(f.read_text(encoding='utf-8')))
                       for f in (root/'data/robots').glob('*.json'))
          ids = json.loads((root/'data/_id_registry.json').read_text(encoding='utf-8'))['ids']
          man = {
              'generated_at': datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'parts': parts, 'robots': robots,
              'software': len(json.loads((root/'data/software.json').read_text(encoding='utf-8'))['items']),
              'ids': len(ids),
              'semantics_version': json.loads((root/'schema/semantics.json').read_text(encoding='utf-8'))['version'],
              'note': '按版本引用数据时请一并记录本清单，便于回溯口径。',
          }
          pathlib.Path('dist/MANIFEST.json').write_text(
              json.dumps(man, ensure_ascii=False, indent=1), encoding='utf-8')
          print(json.dumps(man, ensure_ascii=False))
          PY

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "数据快照 ${{ env.TAG }}"
          body: |
            这是 `data/` + `schema/` 的只读快照，用于按版本引用数据。

            - 附件：`robowiki-data-${{ env.TAG }}.tar.gz`、`SHA256SUMS.txt`、`MANIFEST.json`
            - 口径：见 `schema/semantics.json` 与站点 `/method`
            - 说明：数据以 A/B/C 分级，A 级逐项核对过厂商手册；缺失一律 `null`，不填猜测值
          files: |
            dist/robowiki-data-${{ env.TAG }}.tar.gz
            dist/SHA256SUMS.txt
            dist/MANIFEST.json
