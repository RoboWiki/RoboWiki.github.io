name: PR 门禁

# 静态站 + 数据仓 issue 的 PR 门禁。
# 不再有 backend / Taro app；只做三件事：取锁定数据、构建站点、汇总检查。
# 分支保护只认汇总 job `pr-gate`，内部步骤以后调整不需要再改仓库设置。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: fetch pinned data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data-release.sh

      - name: aggregate issues from data repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOWIKI_DATA_DIR: ${{ github.workspace }}/.data/data
          ROBOWIKI_SCHEMA_DIR: ${{ github.workspace }}/.data/schema
        run: |
          set -euo pipefail
          python -m pipeline.fetch_issues /tmp/issues
          python -m pipeline.ingest_ratings /tmp/issues/issues-rating.json --out "$ROBOWIKI_DATA_DIR"
          python -m pipeline.ingest_reviews /tmp/issues/issues-review.json --out "$ROBOWIKI_DATA_DIR"

      - name: generate wiki pages
        env:
          ROBOWIKI_DATA_DIR: ${{ github.workspace }}/.data/data
          ROBOWIKI_SCHEMA_DIR: ${{ github.workspace }}/.data/schema
          ROBOWIKI_ASSETS_DIR: ${{ github.workspace }}/.data/assets/parts
        run: |
          python -m pip install --quiet pydantic pillow
          python -m pipeline build

      - name: install workspace
        run: pnpm install --no-frozen-lockfile

      - name: build web
        run: pnpm --filter @robowiki/web build

  pr-gate:
    name: pr-gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        env:
          R_BUILD: ${{ needs.build.result }}
        run: |
          echo "build=$R_BUILD"
          test "$R_BUILD" = "success"
