name: PR 门禁

# 数据一旦能被外部 PR 改，就必须有人替维护者挡「看起来对、其实错」的改动。
# 单位写错（g 当 kg）、口径写错（额定当峰值）、图片传错（整机图当电机图）——
# 这些肉眼 review 极容易漏，机器一跑就红。
#
# ── 按路径分层（ADR-002 D2「CI 按路径分层」）────────────────────────────────
# 问题：纯数据 PR（只改 data/*.json）以前也要跑 pytest 全量 + 前端构建，
#       一次 2~3 分钟；而 95% 的 PR 都是数据 PR —— 机器时间全花在「没改的东西」上。
# 做法：先算这次 PR 动了哪几层（changes job），再只跑该层该跑的检查。
#       算不出来（非 PR 事件、取不到 base、改了根目录配置）→ 全量兜底（宁可慢，不可漏）。
#
# 分层判据（flag 由 changes job 输出，完整表见 docs/CI-LAYERS.md）：
#   data      data/**  schema/**               → 数据闸门 + 数据测试（不跑前端构建）
#   pipeline  pipeline/** tools/** tests/**    → 数据闸门 + pytest 全量（含 backend/tests）
#   web       apps/web/** packages/**           → 数据闸门 + 生成 + Astro 构建
#   app       apps/app/**                      → Taro 类型检查 + H5 构建
#   backend   backend/**                       → 数据闸门 + 后端 pytest + import 冒烟
#   full      以上都不匹配的一切（含 docs/**、.github/**、根目录配置）→ 全部跑
#
# 数据闸门（validate）刻意保持「每个 PR 都跑」：它是唯一的必过关，
# 成本只有十几秒，不跟分层赌。分层省的是 pytest 全量与前端构建。
#
# 稳定入口是汇总 job `pr-gate`：分支保护只需要勾这一个检查，
# 以后增删分层 job 都不必再去改仓库设置。
#
# 注意：validate 不加 --strict。库里有 20+ 个「真话式警告」
# （只公布额定扭矩、峰值/额定 >3 等），那是数据现状不是错误。
# strict 会让所有 PR 一律变红，等于把门禁废掉。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 按 ref 分组：全局组会让两个 PR 互相 cancel（取消掉对方的数据闸门）
  group: pr-check-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── 第零关：算分层 ────────────────────────────────────────────────────────
  # 只做一件事：把「这次 PR 动了哪几层」变成 6 个布尔输出。
  # 不用 dorny/paths-filter：仓库现在没有任何第三方 action 依赖，
  # 一段 python 就够，且「算不出来 → 全量」这条兜底只有自己写才控制得住。
  changes:
    name: 变更分层
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      data: ${{ steps.classify.outputs.data }}
      pipeline: ${{ steps.classify.outputs.pipeline }}
      web: ${{ steps.classify.outputs.web }}
      app: ${{ steps.classify.outputs.app }}
      backend: ${{ steps.classify.outputs.backend }}
      layers: ${{ steps.classify.outputs.layers }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟 base 求 merge-base，浅克隆拿不到共同祖先
          fetch-depth: 0

      - name: 判定本次 PR 落在哪一层
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          # ── 判据表：路径前缀 → 需要跑的层 ─────────────────────────────────
          # 只有这里和 docs/CI-LAYERS.md 的表格是「真相」，两边要一起改。
          LAYERS = [
              ("data/", ["data"]),
              ("schema/", ["data"]),       # schema 是数据契约，改它等同于改数据
              ("pipeline/", ["pipeline"]),
              ("tools/", ["pipeline"]),
              ("tests/", ["pipeline"]),
              ("apps/web/", ["web"]),
              ("packages/", ["web"]),
              ("apps/app/", ["app"]),
              ("backend/", ["backend"]),
          ]
          KEYS = ["data", "pipeline", "web", "app", "backend"]


          def changed_files():
              """本次 PR 改动的路径列表；拿不到就返回 None（→ 全量兜底）。"""
              if os.environ.get("EVENT_NAME") != "pull_request":
                  print("非 pull_request 事件（手动触发等）→ 没有可比对的 base")
                  return None
              base = (os.environ.get("BASE_SHA") or "").strip()
              if not base:
                  print("取不到 base sha")
                  return None
              # checkout 已是 fetch-depth: 0，fork PR 的 base 仍可能缺失，补一次
              subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base],
                             capture_output=True, check=False)
              diff = subprocess.run(
                  ["git", "diff", "--name-only", "--no-renames", f"{base}...HEAD"],
                  capture_output=True, text=True)
              if diff.returncode != 0:
                  print("git diff 失败：" + diff.stderr.strip()[:400])
                  return None
              return [line.strip() for line in diff.stdout.splitlines() if line.strip()]


          def classify(files):
              flags = dict.fromkeys(KEYS, False)
              unmapped = []
              for path in files:
                  for prefix, keys in LAYERS:
                      if path.startswith(prefix):
                          for key in keys:
                              flags[key] = True
                          break
                  else:
                      unmapped.append(path)
              return flags, unmapped


          files = changed_files()
          reason = ""
          if files is None:
              files = []
              reason = "没有可比对的 diff（非 PR 事件 / 取不到 base / git 报错）"
          elif not files:
              reason = "diff 为空（异常情况）"

          if reason:
              flags = dict.fromkeys(KEYS, True)
              unmapped = []
          else:
              flags, unmapped = classify(files)
              if unmapped:
                  flags = dict.fromkeys(KEYS, True)
                  reason = "有路径没归到任何层 → 全量兜底"

          full = bool(reason)

          print(f"改动 {len(files)} 个文件")
          for path in files[:60]:
              print("  " + path)
          if len(files) > 60:
              print(f"  ...（共 {len(files)} 个）")
          if unmapped:
              print("未归层路径（触发全量）：")
              for path in unmapped[:20]:
                  print("  " + path)
          if reason:
              print("兜底原因：" + reason)

          if full:
              layers = "full（" + reason + "）"
          else:
              layers = ",".join([k for k in KEYS if flags[k]]) or "无（空 diff）"

          summary = [
              "### PR 门禁分层",
              "",
              f"- 改动文件：{len(files)}",
              f"- 命中层：`{layers}`",
              f"- 全量兜底：`{'true' if full else 'false'}`",
          ]
          if reason:
              summary.append(f"- 原因：{reason}")
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(summary) + "\n")

          out = os.environ.get("GITHUB_OUTPUT")
          lines = [f"full={'true' if full else 'false'}"]
          lines += [f"{k}={'true' if flags[k] else 'false'}" for k in KEYS]
          lines.append("layers=" + layers)
          text = "\n".join(lines)
          print(text)
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(text + "\n")
          PY

  # ── 第一关：数据闸门（必跑，不看分层）─────────────────────────────────────
  validate:
    name: 数据闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取锁定数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data-release.sh
      - run: pip install "pydantic>=2.9"
      - name: 校验目录数据
        run: python -m pipeline validate


  # ── pipeline 层：全量 pytest（pyproject 的 testpaths 含 backend/tests）─────
  # pipeline/ 一改，构建链和 API 都可能被带到，所以这里是「宁可慢」的那一档。
  test:
    name: 测试
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取锁定数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data-release.sh
      - run: |
          pip install "pydantic>=2.9" pytest httpx
          pip install -r backend/requirements.txt
      - name: pipeline + backend
        run: python -m pytest

  # ── backend 层：只动后端时跑后端那一条测试线 + import 冒烟 ────────────────
  # 改 pipeline 的 PR 不重复跑这里：那边 `python -m pytest` 的 testpaths 已经含 backend/tests。
  backend:
    name: 后端冒烟
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取锁定数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data-release.sh
      - run: |
          pip install "pydantic>=2.9" pytest httpx
          pip install -r backend/requirements.txt
      - name: import 冒烟（应用能否装配起来）
        working-directory: backend
        run: python -c "import app, app.main; print('backend import ok:', app.main.app.title)"
      - name: 后端测试
        run: python -m pytest backend/tests

  # ── 前端层：pipeline 产物 → Astro / Taro ──────────────────────────────────
  # 数据改动也要跑生成器，因为导出的 JSON 直接决定页面数量与链接。
  build:
    name: 站点构建
    needs: [changes]
    if: >-
      needs.changes.outputs.full == 'true' || needs.changes.outputs.data == 'true' ||
      needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      DO_WEB: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.web == 'true' }}
      DO_DATA: ${{ needs.changes.outputs.full == 'true' || needs.changes.outputs.data == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取锁定数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-data-release.sh
      - uses: actions/setup-node@v4
        if: env.DO_WEB == 'true'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: env.DO_WEB == 'true'
      - run: pip install "pydantic>=2.9" pytest
      - name: 生成内容
        run: python -m pipeline build
      - name: 数据治理 / 分类测试
        if: env.DO_DATA == 'true'
        run: python -m pytest tests/test_data_governance.py tests/test_taxonomy.py
      - name: 安装工作区依赖
        if: env.DO_WEB == 'true'
        run: pnpm install --no-frozen-lockfile
      - name: Astro 构建
        if: env.DO_WEB == 'true'
        run: pnpm --filter @robowiki/web build

  # ── app 层：Taro H5 / 微信小程序 ───────────────────────────────────────────
  app:
    name: 互动端构建
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.app == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - name: Taro 类型检查
        run: pnpm --filter @robowiki/app typecheck
      - name: Taro H5 构建
        env:
          APP_BASE: /app/
        run: pnpm --filter @robowiki/app build:h5

  # ── 汇总：分支保护的稳定入口 ─────────────────────────────────────────────
  # 只做一件事：任何一个需要跑的 job 没成功，这里就红。
  # skipped 视为「这一层没被触发」= 通过；「输出缺失」不能当跳过放行。
  gate:
    name: pr-gate
    needs: [changes, validate, test, backend, build, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        env:
          LAYERS: ${{ needs.changes.outputs.layers }}
          FULL: ${{ needs.changes.outputs.full }}
          DATA: ${{ needs.changes.outputs.data }}
          PIPELINE: ${{ needs.changes.outputs.pipeline }}
          WEB: ${{ needs.changes.outputs.web }}
          APP: ${{ needs.changes.outputs.app }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          R_CHANGES: ${{ needs.changes.result }}
          R_VALIDATE: ${{ needs.validate.result }}
          R_TEST: ${{ needs.test.result }}
          R_BACKEND: ${{ needs.backend.result }}
          R_BUILD: ${{ needs.build.result }}
          R_APP: ${{ needs.app.result }}
        run: |
          set -u
          fail=0
          echo "分层：full=$FULL data=$DATA pipeline=$PIPELINE web=$WEB app=$APP backend=$BACKEND"
          echo "命中：$LAYERS"

          # 分层算不出来时这里会是空串。空串绝不能当「全跳过」，必须显式失败。
          for pair in "full:$FULL" "data:$DATA" "pipeline:$PIPELINE" \
                      "web:$WEB" "app:$APP" "backend:$BACKEND"; do
            key=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::error::分层输出 $key 缺失或非法（'$value'）——按失败处理"
              fail=1
            fi
          done

          printf '%-12s %s\n' "job" "结果"
          while IFS='|' read -r job result; do
            [ -z "$job" ] && continue
            printf '%-12s %s\n' "$job" "$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::$job 的结果是 $result"
                fail=1
                ;;
            esac
          done <<EOF
          changes|$R_CHANGES
          validate|$R_VALIDATE
          test|$R_TEST
          backend|$R_BACKEND
          build|$R_BUILD
          app|$R_APP
          EOF

          if [ "$fail" -ne 0 ]; then
            echo "PR 门禁：不通过"
            exit 1
          fi
          echo "PR 门禁：通过"
