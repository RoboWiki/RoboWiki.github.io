name: Deploy wiki to GitHub Pages

# Astro 静态站：目录从 `RoboWiki` 仓的锁定 release 取。
# 评分 / 实测来自数据仓的 GitHub Issue，构建时按标签拉取并聚合，
# 不写数据库、不提交快照；Issue 是数据的一部分。
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'data.lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Issue 在数据仓，站点仓收不到 issues 事件；每日重建一次让新评分/实测生效。
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch pinned data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python -c "import json;print(json.load(open('data.lock.json'))['data_version'])")
          REPO=$(python -c "import json;print(json.load(open('data.lock.json'))['source_repo'])")
          ASSET=$(python -c "import json;print(json.load(open('data.lock.json'))['release_asset'])")
          SHA=$(python -c "import json;print(json.load(open('data.lock.json'))['sha256'])")
          mkdir -p .data
          gh release download "$TAG" -R "$REPO" -p "$ASSET" -D .data --clobber
          echo "$SHA  .data/$ASSET" | sha256sum -c -
          tar -xzf ".data/$ASSET" -C .data
          test -f .data/data/taxonomy.json
          test -f .data/schema/semantics.json
          test -d .data/assets/parts

      # Issue 是数据的一部分：构建时从数据仓拉取 rating/review 标签，
      # 聚合到解压后的 .data/data，再由 pipeline build 烤进 ratings.json。
      - name: aggregate issues from data repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROBOWIKI_DATA_DIR: ${{ github.workspace }}/.data/data
          ROBOWIKI_SCHEMA_DIR: ${{ github.workspace }}/.data/schema
        run: |
          set -euo pipefail
          python -m pipeline.fetch_issues /tmp/issues
          python -m pipeline.ingest_ratings /tmp/issues/issues-rating.json --out "$ROBOWIKI_DATA_DIR"
          python -m pipeline.ingest_reviews /tmp/issues/issues-review.json --out "$ROBOWIKI_DATA_DIR"

      - name: generate wiki pages from pinned data
        env:
          ROBOWIKI_DATA_DIR: ${{ github.workspace }}/.data/data
          ROBOWIKI_SCHEMA_DIR: ${{ github.workspace }}/.data/schema
          ROBOWIKI_ASSETS_DIR: ${{ github.workspace }}/.data/assets/parts
        run: |
          python -m pip install --quiet pydantic pillow
          python -m pipeline build

      # 版本由根 package.json 的 packageManager 决定；此处再写 version 会冲突。
      - uses: pnpm/action-setup@v4

      - name: install workspace
        run: pnpm install --no-frozen-lockfile

      - name: build Astro site
        run: pnpm --filter @robowiki/web build

      - name: assemble GitHub Pages artifact
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp -R apps/web/dist/. site/
          test -f site/index.html
          test -f site/catalog.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
