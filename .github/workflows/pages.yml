name: Deploy wiki to GitHub Pages

# 站点只负责渲染：目录数据从 `RoboWiki` 仓的锁定 release 取。
# 不在本仓保存 schema/、catalog 或产品图副本。
#
# 唯一的例外是社区快照（data/ratings_snapshot.json、data/reviews_snapshot.json）：
#   · 评分 / 实测来自本仓 issue，由 aggregate-ratings.yml 聚合后提交在本仓 data/；
#   · `RoboWiki` 仓 release 只装目录数据（catalog / taxonomy / schema / assets），
#     本仓 data/ 才是这两份快照的唯一可写产地。
#   所以 paths 里要盯着 data/** —— 否则聚合提交后不会触发部署，线上分数永远停在旧值。
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'pipeline/**'
      - 'console/public/**'
      - 'apps/web/**'
      - 'apps/app/**'
      - 'packages/**'
      - 'data.lock.json'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch pinned data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(python -c "import json;print(json.load(open('data.lock.json'))['data_version'])")
          REPO=$(python -c "import json;print(json.load(open('data.lock.json'))['source_repo'])")
          ASSET=$(python -c "import json;print(json.load(open('data.lock.json'))['release_asset'])")
          SHA=$(python -c "import json;print(json.load(open('data.lock.json'))['sha256'])")
          mkdir -p .data
          gh release download "$TAG" -R "$REPO" -p "$ASSET" -D .data --clobber
          echo "$SHA  .data/$ASSET" | sha256sum -c -
          tar -xzf ".data/$ASSET" -C .data
          test -f .data/data/taxonomy.json
          test -f .data/schema/semantics.json
          test -d .data/assets/parts

      # pipeline 读的是 $ROBOWIKI_DATA_DIR/ratings_snapshot.json、reviews_snapshot.json。
      # 这两份社区快照归本仓 data/，release 里即使有同名文件也是发布时的旧值，
      # 所以用本仓的版本覆盖进解压目录。文件不存在就跳过：
      # 新 fork、或还没人评分 / 提实测时，构建不能因此中断。
      - name: overlay community snapshots
        run: |
          set -euo pipefail
          for name in ratings_snapshot.json reviews_snapshot.json; do
            src="data/$name"
            if [ -f "$src" ]; then
              cp "$src" ".data/data/$name"
              echo "覆盖 .data/data/$name <- $src"
            else
              echo "跳过 $src（本仓暂无此快照，构建继续）"
            fi
          done

      - name: generate wiki pages from pinned data
        env:
          ROBOWIKI_DATA_DIR: ${{ github.workspace }}/.data/data
          ROBOWIKI_SCHEMA_DIR: ${{ github.workspace }}/.data/schema
          ROBOWIKI_ASSETS_DIR: ${{ github.workspace }}/.data/assets/parts
        run: |
          python -m pip install --quiet pydantic
          python -m pipeline build

      - name: install & build
        working-directory: wiki
        env:
          WIKI_BASE: /
        run: |
          npm ci
          npm run build

      # Astro 迁移预览：挂在 /next/，不替换现有 VitePress 生产路径。
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: build Astro preview
        env:
          BASE_PATH: /next
        run: |
          set -euo pipefail
          pnpm install --filter @robowiki/web... --no-frozen-lockfile
          pnpm --filter @robowiki/web build
          mkdir -p wiki/docs/.vitepress/dist/next
          cp -R apps/web/dist/. wiki/docs/.vitepress/dist/next/

      - name: build Taro H5 preview
        env:
          APP_BASE: /app/
        run: |
          set -euo pipefail
          pnpm install --filter @robowiki/app... --no-frozen-lockfile
          pnpm --filter @robowiki/app build:h5
          mkdir -p wiki/docs/.vitepress/dist/app
          cp -R apps/app/dist/h5/. wiki/docs/.vitepress/dist/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
