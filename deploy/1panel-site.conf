# 1Panel 站点配置模板（唯一公网入口）
#
# 用法：1Panel → 网站 → robowiki.org.cn → 配置文件，整段替换 server 块。
# 不要与旧的 location / 叠加，否则 nginx -t 会报 duplicate location。
#
# 前提：
#   · compose.yml 把 API 发布在 127.0.0.1:8080（API_PORT 默认 8080）；
#   · 当前 1Panel OpenResty 是 host 网络，所以反代走宿主机回环，不是 api:8000；
#   · 静态站仍由 include 的 proxy/*.conf 负责（Pages 或本机 dist）。
#
# 如果 OpenResty 不是 host 网络，二选一：
#   · docker network connect robowiki_default <openresty容器名>，然后 proxy_pass http://api:8000;
#   · 或把 API 端口发布到 Docker 网关地址，再改 proxy_pass（不建议暴露公网）。

server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name robowiki.org.cn;
    index index.php index.html index.htm default.php default.htm default.html;

    # 只读目录没有上传接口；给请求体一个上限，防止异常大包拖垮反代。
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/robowiki.org.cn/log/access.log main;
    error_log /www/sites/robowiki.org.cn/log/error.log;

    # 如果 1Panel 的 proxy/*.conf 已经声明了同名 ACME location，删掉这一段，
    # 只保留下面“ACME 不跳转”的 if，避免 nginx duplicate location。
    location ^~ /.well-known/acme-challenge {
        allow all;
        # 与 1Panel 站点根目录保持一致；改站点目录时这里要同步。
        root /www/sites/robowiki.org.cn/index;
    }

    # ===== RoboWiki API =====
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ===== MCP（SSE 需要长连接）=====
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ===== 控制台 =====
    location = /console { return 308 /console/; }
    location ^~ /console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1Panel 原有的静态/反代配置；本模板不改它。
    include /www/sites/robowiki.org.cn/proxy/*.conf;

    # ACME HTTP-01 必须能在 80 端口访问；server 级 return 会先于 location 执行，
    # 所以只对非 ACME 的 http 请求跳 HTTPS。不用嵌套 if，避免 rewrite 阶段歧义。
    set $rw_redirect_https 0;
    if ($scheme = http) { set $rw_redirect_https 1; }
    if ($request_uri ~ ^/\.well-known/acme-challenge/) { set $rw_redirect_https 0; }
    if ($rw_redirect_https) { return 301 https://$host$request_uri; }

    ssl_certificate /www/sites/robowiki.org.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/robowiki.org.cn/ssl/privkey.pem;
    # 1Panel 默认会带 TLSv1/1.1；这里收紧到 1.2+。如果 1Panel 重新生成配置，
    # 在 1Panel 的 SSL 设置里同步关闭旧协议。
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 497 https://$host$request_uri;
    proxy_set_header X-Forwarded-Proto https;

    # ===== 安全头 =====
    # 静态页由 GitHub Pages 反代，proxy/*.conf 里的 location 自己带缓存头，
    # nginx 的 add_header 不会被继承；所以统一在 header filter 里补，
    # 覆盖静态页、API、控制台和 404，且不会和上游 HSTS 重复。
    #
    # CSP 里的外部源不能删：
    #   · github.com / avatars.githubusercontent.com   贡献者头像
    #   · giscus.app                                   文档评论（client.js + iframe）
    header_filter_by_lua_block {
        local h = ngx.header
        if not h["X-Content-Type-Options"] then h["X-Content-Type-Options"] = "nosniff" end
        if not h["X-Frame-Options"] then h["X-Frame-Options"] = "SAMEORIGIN" end
        if not h["Referrer-Policy"] then h["Referrer-Policy"] = "strict-origin-when-cross-origin" end
        if not h["Permissions-Policy"] then h["Permissions-Policy"] = "geolocation=(), microphone=(), camera=(), payment=()" end
        if ngx.var.scheme == "https" and not h["Strict-Transport-Security"] then
            h["Strict-Transport-Security"] = "max-age=31536000"
        end
        if not h["Content-Security-Policy"] then
            h["Content-Security-Policy"] = "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://github.com https://avatars.githubusercontent.com https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://giscus.app; frame-src 'self' https://giscus.app; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
        end
    }
}
