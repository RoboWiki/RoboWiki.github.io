# 1Panel 站点配置模板（唯一公网入口）
#
# 用法：1Panel → 网站 → robowiki.org.cn → 配置文件，整段替换 server 块。
# 不要与旧的 location / 叠加，否则 nginx -t 会报 duplicate location。
#
# 前提：
#   · compose.yml 把 API 发布在 127.0.0.1:8080（API_PORT 默认 8080）；
#   · 当前 1Panel OpenResty 是 host 网络，所以反代走宿主机回环，不是 api:8000；
#   · 静态站仍由 include 的 proxy/*.conf 负责（Pages 或本机 dist）。
#
# 如果 OpenResty 不是 host 网络，二选一：
#   · docker network connect robowiki_default <openresty容器名>，然后 proxy_pass http://api:8000;
#   · 或把 API 端口发布到 Docker 网关地址，再改 proxy_pass（不建议暴露公网）。

server {
    listen 80 ;
    listen 443 ssl http2 ;
    server_name robowiki.org.cn;
    index index.php index.html index.htm default.php default.htm default.html;

    # 只读目录没有上传接口；给请求体一个上限，防止异常大包拖垮反代。
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    access_log /www/sites/robowiki.org.cn/log/access.log main;
    error_log /www/sites/robowiki.org.cn/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # ===== RoboWiki API =====
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ===== MCP（SSE 需要长连接）=====
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /mcp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ===== 控制台 =====
    location = /console { return 308 /console/; }
    location ^~ /console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1Panel 原有的静态/反代配置；本模板不改它。
    include /www/sites/robowiki.org.cn/proxy/*.conf;

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/robowiki.org.cn/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/robowiki.org.cn/ssl/privkey.pem;
    # 1Panel 默认会带 TLSv1/1.1；这里收紧到 1.2+。如果 1Panel 重新生成配置，
    # 在 1Panel 的 SSL 设置里同步关闭旧协议。
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    error_page 497 https://$host$request_uri;
    proxy_set_header X-Forwarded-Proto https;

    # ===== 安全头 =====
    # 这些 add_header 在 server 级，会被没有自己 add_header 的 location 继承。
    # 如果 include 的 proxy/*.conf 里某个 location 也写了 add_header，
    # 该 location 不会继承这里的安全头，需要把同样几行加进去。
    #
    # CSP 里的两个外部源不能删：
    #   · giscus.app                         文档评论（client.js + iframe）
    #   · avatars.githubusercontent.com      贡献者头像
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://giscus.app; frame-src 'self' https://giscus.app; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
