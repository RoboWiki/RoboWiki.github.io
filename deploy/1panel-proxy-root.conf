# 1Panel 静态反代 location（robowiki.org.cn -> GitHub Pages）
#
# 用法：1Panel → 网站 → robowiki.org.cn → 配置文件 → proxy/root.conf，
# 把本文件的 location 合并进去（或只补上 proxy_set_header Accept-Encoding "";）。
#
# 为什么必须在 location 内写：
#   location 里一旦出现任何 proxy_set_header，就不会继承 server 级的 proxy_set_header；
#   不写这一行，上游 Pages 会按浏览器请求返回 gzip，QQ 的 Go-http-client 预览解析器
#   拿到压缩 HTML 后不解压，链接卡片只剩 URL。
location ^~ / {
    proxy_pass https://robowiki.github.io;
    proxy_set_header Host robowiki.github.io;
    proxy_set_header Accept-Encoding "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_http_version 1.1;
    # 链接预览爬虫可能伪装成 Chrome；静态 HTML 一律不压缩，避免任何解析器读不到 meta。
    # 图片不在此列，仍按原缓存策略。
    gzip off;
    add_header X-Cache $upstream_cache_status;
    proxy_ssl_server_name off;
    proxy_ssl_name $proxy_host;
    add_header Strict-Transport-Security "max-age=31536000";
    proxy_ignore_headers Set-Cookie Cache-Control expires;
    proxy_cache proxy_cache_panel;
    proxy_cache_key $host$uri$is_args$args;
    proxy_cache_valid 200 304 301 302 10m;
    if ( $uri ~* "\.(gif|png|jpg|css|js|woff|woff2)$" ) {
        expires 1m;
    }
}
