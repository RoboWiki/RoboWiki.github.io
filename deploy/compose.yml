# 生产入口是 1Panel 的 OpenResty：静态站由 Pages/1Panel 提供，
# /api /mcp /console 反代到本机 API。这里只跑后端四件套，不再带 Caddy。
# API 只发布到宿主机回环，不要把 API_PORT 改成 0.0.0.0。
name: robowiki

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  ROBOWIKI_DATABASE_URL: postgresql+psycopg://robowiki:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/robowiki
  ROBOWIKI_DATA_DIR: /data
  ROBOWIKI_SCHEMA_DIR: /schema
  ROBOWIKI_MEDIA_DIR: /app/var/media
  ROBOWIKI_DATA_VERSION: ${DATA_VERSION:-}
  ROBOWIKI_AUTO_CREATE_TABLES: "false"
  ROBOWIKI_SEED_DEMO: "false"
  ROBOWIKI_EXPOSE_DOCS: ${EXPOSE_DOCS:-false}
  ROBOWIKI_ADMIN_HANDLE: ${ADMIN_HANDLE:-}
  ROBOWIKI_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ROBOWIKI_ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-站务}
  ROBOWIKI_SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (>=32 bytes)}
  ROBOWIKI_CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","https://robowiki.org.cn","https://robowiki.github.io"]}'
  ROBOWIKI_SITE_URL: ${SITE_URL:-https://robowiki.org.cn}
  ROBOWIKI_BOT_TOKEN: ${BOT_TOKEN:-}
  ROBOWIKI_EMAIL_MODE: ${EMAIL_MODE:-log}
  ROBOWIKI_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  ROBOWIKI_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  ROBOWIKI_GITHUB_OAUTH_SCOPE: ${GITHUB_OAUTH_SCOPE:-read:user user:email}
  ROBOWIKI_WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
  ROBOWIKI_WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
  ROBOWIKI_OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}
  ROBOWIKI_SMTP_HOST: ${SMTP_HOST:-}
  ROBOWIKI_SMTP_PORT: ${SMTP_PORT:-587}
  ROBOWIKI_SMTP_USER: ${SMTP_USER:-}
  ROBOWIKI_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  ROBOWIKI_SMTP_FROM: ${SMTP_FROM:-RoboWiki <no-reply@robowiki.org.cn>}
  ROBOWIKI_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  ROBOWIKI_PUBLISH_MODE: ${PUBLISH_MODE:-dryrun}
  ROBOWIKI_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  ROBOWIKI_CORE_REPO: ${CORE_REPO:-RoboWiki/RoboWiki}
  ROBOWIKI_CORE_BRANCH: ${CORE_BRANCH:-main}

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: robowiki/api:${TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    environment:
      <<: *api-env
    volumes:
      - ${DATA_DIR:-../.data/data}:/data:ro
      - ${SCHEMA_DIR:-../.data/schema}:/schema:ro
      - ${MEDIA_DIR:-./var/media}:/app/var/media
      - ../data.lock.json:/app/data.lock.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: robowiki/api:${TAG:-dev}
    environment:
      <<: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: robowiki/api:${TAG:-dev}
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *api-env
    command: ["python", "-m", "app.worker"]
    volumes:
      - ${DATA_DIR:-../.data/data}:/data:ro
      - ${SCHEMA_DIR:-../.data/schema}:/schema:ro
      - ./var/outbox:/app/var/outbox
      - ../data.lock.json:/app/data.lock.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: robowiki
      POSTGRES_USER: robowiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robowiki -d robowiki"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
