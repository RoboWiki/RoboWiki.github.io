[project]
name = "robowiki"
version = "0.1.0"
description = "面向机器人制作全流程的可追溯工程知识库：部件选型、加工采购、教程案例与开源索引"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "zeitvex" }]
keywords = ["robotics", "actuator", "quadruped", "catalog", "open-data"]

# 构建链只需要很少的东西：读 JSON、校验、生成 Markdown。
# 站点是纯静态的，不依赖 Web 框架或数据库。
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.21",      # schema/ 的机器校验，CI 里开
]
# 采集/图片工具才需要，普通贡献者不用装
tools = [
    "pillow>=10",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://robowiki.github.io/"
Repository = "https://github.com/RoboWiki/RoboWiki.github.io"
Issues = "https://github.com/RoboWiki/RoboWiki/issues"

[project.scripts]
robowiki = "pipeline.__main__:main"

[tool.setuptools]
# 只打包 pipeline；apps/web 是独立的前端构建，不是 Python 包。
# 不显式声明时 setuptools 的 flat-layout 自动发现会因多个顶层目录而构建失败。
packages = ["pipeline"]

[tool.pytest.ini_options]
# 一条测试线：pipeline（构建链 / 数据聚合）。
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
